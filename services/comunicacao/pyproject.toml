[project]
name = 'comunicacao'
version = '0.1.0'
description = 'Comunicados institucionais'
requires-python = '>=3.12,<4.0'
dependencies = [
    'fastapi[standard] (>=0.141.1,<0.142.0)',
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
]

[build-system]
requires = ['poetry-core>=2.0.0,<3.0.0']
build-backend = 'poetry.core.masonry.api'

[dependency-groups]
dev = [
    'pytest (>=9.1.1,<10.0.0)',
    'httpx2 (>=2.13.0,<3.0.0)',
]

[tool.pytest.ini_options]
pythonpath = ['.']
